<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="zenithBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>

    <!-- Radial Top-Left Highlight -->
    <radialGradient id="topGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>

    <!-- Frosted Tile Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Frosted Tile Border Gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>

    <filter id="checkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>

    <filter id="sparkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Base Squircle with Gradient & Lighting -->
  <rect width="512" height="512" rx="112" fill="url(#zenithBg)"/>
  <rect width="512" height="512" rx="112" fill="url(#topGlow)"/>

  <!-- Frosted Glass Card -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Checkmark -->
  <path d="M 166 262 L 226 322 L 346 198" fill="none" stroke="url(#checkGrad)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#checkShadow)"/>

  <!-- Zenith Spark (4-Point Star) -->
  <g filter="url(#sparkGlow)">
    <path d="M 358 134 C 358 147.2 368.8 158 382 158 C 368.8 158 358 168.8 358 182 C 358 168.8 347.2 158 334 158 C 347.2 158 358 147.2 358 134 Z" fill="url(#sparkGrad)"/>
  </g>
</svg>
